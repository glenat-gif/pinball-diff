name: Daily pinball digest

# Runs once a day, fetches every area's feed from Pinball Map, merges it into the
# event store, and commits the store and digests back.

on:
  schedule:
    - cron: "17 20 * * *"      # about 6 or 7 am in Melbourne
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch, diff and write the digest
        run: python -m pbmdiff.run sync
        env:
          PINBALLMAP_API_TOKEN: ${{ secrets.PINBALLMAP_API_TOKEN }}
      - name: Keep the snapshot and digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Events and digests for $(date -u +%F)"
          git push
