name: Daily pinball digest

# Every morning: fetch what changed on Pinball Map, write the zone digests,
# make Thursday's email issue when it is due, keep it all in git, then
# rebuild the website. The email waits as a Buttondown draft unless site.json
# says "email_mode": "send".

on:
  schedule:
    - cron: "17 20 * * *"      # about 6 or 7 am in Melbourne; GitHub often runs it later
    - cron: "17 23 * * *"      # a second go mid-morning, in case GitHub cancelled the first in its queue
  workflow_dispatch:
    inputs:
      redraft:
        description: "Rebuild this week's issue and rewrite its Buttondown draft"
        type: boolean
        default: false
      preview:
        description: "Draft next Thursday's email from today's data as a throwaway Buttondown draft"
        type: boolean
        default: false
      tag_subscriber:
        description: "Buttondown subscriber id (sub_...) to tag; the log then lists every subscriber's tags, addresses masked"
        type: string
        default: ""
      tag:
        description: "Tags to add to that subscriber, comma separated"
        type: string
        default: "vic"
      send_now:
        description: "Send this week's Buttondown draft to the list now"
        type: boolean
        default: false
      probe_subscriber:
        description: "Subscriber id to send a throwaway tag probe email to"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover tests
      - name: Fetch and write the digests
        run: python -m pbmdiff.run sync
        env:
          PINBALLMAP_API_TOKEN: ${{ secrets.PINBALLMAP_API_TOKEN }}
          IFPA_API_KEY: ${{ secrets.IFPA_API_KEY }}
      - name: Tag a subscriber, when asked
        if: ${{ inputs.tag_subscriber != '' }}
        run: python -m pbmdiff.run subscribers --tag-id "${{ inputs.tag_subscriber }}" --tag "${{ inputs.tag }}"
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      - name: Send a tag probe, when asked
        if: ${{ inputs.probe_subscriber != '' }}
        run: python -m pbmdiff.run subscribers --probe "${{ inputs.probe_subscriber }}"
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      - name: Make and deliver this week's email if due
        run: python -m pbmdiff.run issue ${{ inputs.redraft && '--redraft' || '' }} ${{ inputs.preview && '--preview' || '' }} ${{ inputs.send_now && '--send-now' || '' }}
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      - name: Keep the events, digests and issues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Events and digests for $(TZ=Australia/Melbourne date +%F)"
          git push
      - name: Build the website
        run: python -m pbmdiff.run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
